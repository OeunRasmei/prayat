<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prayat — scam message checker</title>
  <meta name="description" content="Paste a message or a screenshot and check whether it looks like a scam. Works in English, Khmer and Chinese, on your device.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 6h22a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z' fill='%230E5A57'/%3E%3Cpath d='M16 10v7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='1.8' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="theme-color" content="#0B3533">
  <link href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div class="band" id="top">
    <div class="wrap">
      <header class="top">
        <a class="brand" href="#top" aria-label="Prayat home">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 6h22a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z"/><path class="mark" d="M16 10v7"/><circle class="dot" cx="16" cy="21" r="1.8"/></svg>
          <span class="brand-km" lang="km">ប្រយ័ត្ន</span>
          <span class="brand-en">Prayat</span>
        </a>
        <nav class="nav" aria-label="Sections">
          <a href="#how" data-i18n="nav_how"></a>
          <a href="#accuracy" data-i18n="nav_acc"></a>
          <a href="https://github.com/OeunRasmei/prayat" data-i18n="nav_code"></a>
        </nav>
        <div class="ui-lang" role="group" aria-label="Interface language">
          <button type="button" data-ui="en" lang="en">English</button>
          <button type="button" data-ui="km" lang="km">ខ្មែរ</button>
          <button type="button" data-ui="zh" lang="zh">中文</button>
        </div>
      </header>

      <section class="hero">
        <p class="sign" lang="km" aria-hidden="true"><span>!</span>ប្រយ័ត្ន</p>
        <h1 data-i18n="tagline"></h1>
        <p class="intro" data-i18n="intro"></p>
        <ul class="trust" id="trust"></ul>
      </section>
    </div>
  </div>

  <main class="wrap">
    <section class="checker">
      <div class="panel composer-panel">
        <label for="message" class="panel-title" data-i18n="composer_label"></label>
        <div class="composer" id="composer">
          <div class="attachment" id="attachment" hidden>
            <img id="thumb" alt="">
            <div class="att-body">
              <p id="ocr-status" role="status"></p>
              <div class="progress" id="progress" hidden><span></span></div>
            </div>
            <button type="button" class="icon-btn" id="remove-image" data-i18n-aria="remove_image">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <textarea id="message" rows="7" data-i18n-placeholder="placeholder" spellcheck="false"></textarea>
          <div class="toolbar">
            <label class="tool-btn">
              <input type="file" id="file" accept="image/*">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
              <span data-i18n="add_image"></span>
            </label>
            <span class="drop-hint" data-i18n="drop_hint"></span>
          </div>
          <div class="drop-overlay" id="drop-overlay" hidden><p data-i18n="dropping"></p></div>
        </div>
        <div class="actions">
          <button type="button" id="check" class="btn primary"><span data-i18n="check"></span><kbd class="kbd">Ctrl&#8239;+&#8239;Enter</kbd></button>
          <button type="button" id="clear" class="btn ghost" data-i18n="clear"></button>
        </div>
        <p id="hint" class="hint" role="status"></p>
        <div class="examples">
          <p class="examples-title" data-i18n="try"></p>
          <div class="example-list" id="examples"></div>
        </div>
        <div class="ocr-row">
          <label for="ocr-lang" data-i18n="ocr_lang"></label>
          <select id="ocr-lang">
            <option value="eng+khm+chi_sim" data-i18n="auto"></option>
            <option value="eng" lang="en">English</option>
            <option value="khm" lang="km">ខ្មែរ</option>
            <option value="chi_sim" lang="zh">中文</option>
          </select>
        </div>
        <p class="note" data-i18n="ocr_note"></p>
      </div>

      <div class="panel result-panel" id="result">
        <div class="empty" id="empty">
          <h2 data-i18n="empty_title"></h2>
          <ol class="signs" id="signs"></ol>
        </div>
        <div class="filled" id="filled" hidden>
          <div class="verdict-row">
            <span class="verdict-icon" id="verdict-icon" aria-hidden="true"></span>
            <div>
              <h2 class="verdict" id="verdict" tabindex="-1"></h2>
              <p class="sub" id="verdict-sub"></p>
            </div>
          </div>
          <div class="bubble-wrap">
            <p class="bubble" id="bubble"></p>
            <p class="stamp" id="stamp" aria-hidden="true"></p>
          </div>
          <div class="block" id="why">
            <h3 data-i18n="why_title"></h3>
            <ul class="flags" id="flags"></ul>
            <p class="why-hint" data-i18n="why_hint"></p>
          </div>
          <div class="block">
            <h3 data-i18n="probs_title"></h3>
            <ul class="scores" id="scores"></ul>
          </div>
          <div class="block">
            <h3 data-i18n="todo_title"></h3>
            <ul class="todo" id="todo"></ul>
          </div>
          <div class="result-actions">
            <button type="button" class="btn secondary" id="another" data-i18n="check_another"></button>
          </div>
          <p class="disclaimer" data-i18n="disclaimer"></p>
        </div>
      </div>
    </section>

    <p class="status" id="status" role="status"></p>

    <section class="how" id="how">
      <h2 data-i18n="how_title"></h2>
      <ol class="steps" id="steps"></ol>
    </section>

    <section class="accuracy" id="accuracy">
      <h2 data-i18n="model_title"></h2>
      <p class="lede" id="model-lede"></p>
      <div class="acc-cards" id="acc-cards"></div>
      <p class="small" data-i18n="data_note"></p>
      <p class="small" data-i18n="limits"></p>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p data-i18n="footer"></p>
      <p><a href="https://github.com/OeunRasmei/prayat" data-i18n="source"></a></p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
