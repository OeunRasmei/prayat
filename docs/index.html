<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prayat — scam message checker</title>
  <meta name="description" content="Paste a message or a screenshot and check whether it looks like a scam. Works in English, Khmer and Chinese, on your device.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 6h22a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z' fill='%230E5A57'/%3E%3Cpath d='M16 10v7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='1.8' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#top" aria-label="Prayat home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 6h22a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z"/><path class="mark" d="M16 10v7"/><circle class="dot" cx="16" cy="21" r="1.8"/></svg>
      <span class="brand-km" lang="km">ប្រយ័ត្ន</span>
      <span class="brand-en">Prayat</span>
    </a>
    <div class="ui-lang" role="group" aria-label="Interface language">
      <button type="button" data-ui="en" lang="en">English</button>
      <button type="button" data-ui="km" lang="km">ខ្មែរ</button>
      <button type="button" data-ui="zh" lang="zh">中文</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <h1 data-i18n="tagline"></h1>
      <p data-i18n="intro"></p>
    </section>

    <section class="checker">
      <div class="panel input-panel">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-text" aria-controls="pane-text" aria-selected="true" data-i18n="tab_text"></button>
          <button type="button" role="tab" id="tab-image" aria-controls="pane-image" aria-selected="false" tabindex="-1" data-i18n="tab_image"></button>
        </div>

        <div id="pane-text" role="tabpanel" aria-labelledby="tab-text">
          <textarea id="message" rows="7" data-i18n-aria="placeholder" data-i18n-placeholder="placeholder" spellcheck="false"></textarea>
          <div class="examples">
            <span data-i18n="try"></span>
            <button type="button" class="chip" data-example="en" lang="en">English</button>
            <button type="button" class="chip" data-example="km" lang="km">ខ្មែរ</button>
            <button type="button" class="chip" data-example="zh" lang="zh">中文</button>
          </div>
          <div class="actions">
            <button type="button" id="check" class="btn primary" data-i18n="check"></button>
            <button type="button" id="clear" class="btn ghost" data-i18n="clear"></button>
          </div>
          <p id="hint" class="hint" role="status"></p>
        </div>

        <div id="pane-image" role="tabpanel" aria-labelledby="tab-image" hidden>
          <div id="drop" class="drop">
            <img id="thumb" alt="" hidden>
            <p class="drop-title" data-i18n="drop_title"></p>
            <p class="drop-sub">
              <span data-i18n="drop_sub"></span>
              <label class="btn secondary file-btn"><input type="file" id="file" accept="image/*"><span data-i18n="choose"></span></label>
            </p>
          </div>
          <div class="ocr-row">
            <label for="ocr-lang" data-i18n="ocr_lang"></label>
            <select id="ocr-lang">
              <option value="eng+khm+chi_sim" data-i18n="auto"></option>
              <option value="eng" lang="en">English</option>
              <option value="khm" lang="km">ខ្មែរ</option>
              <option value="chi_sim" lang="zh">中文</option>
            </select>
          </div>
          <div class="progress" id="progress" hidden><span></span></div>
          <p id="ocr-status" class="hint" role="status"></p>
          <p class="note" data-i18n="ocr_note"></p>
        </div>
      </div>

      <div class="panel result-panel" id="result">
        <div class="empty" id="empty">
          <h2 data-i18n="empty_title"></h2>
          <ul id="tips"></ul>
        </div>
        <div class="filled" id="filled" hidden>
          <div class="bubble-wrap">
            <p class="bubble" id="bubble"></p>
            <p class="stamp" id="stamp" aria-hidden="true"></p>
          </div>
          <h2 class="verdict" id="verdict" tabindex="-1"></h2>
          <p class="sub" id="verdict-sub"></p>

          <h3 data-i18n="probs_title"></h3>
          <div class="bar" id="bar" aria-hidden="true"><span class="seg normal"></span><span class="seg spam"></span><span class="seg scam"></span></div>
          <ul class="legend" id="legend"></ul>

          <div id="why">
            <h3 data-i18n="why_title"></h3>
            <ul class="flags" id="flags"></ul>
          </div>

          <h3 data-i18n="todo_title"></h3>
          <ul class="todo" id="todo"></ul>
          <p class="disclaimer" data-i18n="disclaimer"></p>
        </div>
      </div>
    </section>

    <p class="status" id="status" role="status"></p>

    <section class="how" id="how">
      <h2 data-i18n="how_title"></h2>
      <ol class="steps" id="steps"></ol>
    </section>

    <section class="accuracy" id="accuracy">
      <h2 data-i18n="model_title"></h2>
      <p class="lede" id="model-lede"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col" data-i18n="th_lang"></th><th scope="col" class="num" data-i18n="th_n"></th><th scope="col" class="num" data-i18n="th_f1"></th><th scope="col" class="num" data-i18n="th_caught"></th><th scope="col" class="num" data-i18n="th_false"></th></tr></thead>
          <tbody id="acc-body"></tbody>
        </table>
      </div>
      <p class="small" data-i18n="data_note"></p>
      <p class="small" data-i18n="limits"></p>
    </section>
  </main>

  <footer class="foot">
    <p data-i18n="footer"></p>
    <p><a href="https://github.com/OeunRasmei/prayat" data-i18n="source"></a></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
